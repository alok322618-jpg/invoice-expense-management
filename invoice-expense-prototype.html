<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice &amp; Expense Management — Prototype</title>
<style>
:root{
  --accent:#4f46e5; --accent-dark:#4338ca; --accent-soft:#eef2ff;
  --bg:#f6f7f9; --card:#ffffff; --border:#e5e7eb; --border-soft:#f0f1f4;
  --text:#111827; --muted:#6b7280; --muted-2:#9ca3af;
  --green-bg:#dcfce7; --green-tx:#15803d;
  --amber-bg:#fef3c7; --amber-tx:#92400e;
  --blue-bg:#dbeafe; --blue-tx:#1d4ed8;
  --red-bg:#fee2e2; --red-tx:#b91c1c;
  --gray-bg:#f3f4f6; --gray-tx:#4b5563;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:232px;flex:0 0 232px;background:var(--card);border-right:1px solid var(--border);
  padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:4px 10px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px}
.brand .t1{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .t2{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--muted);
  font-weight:500;font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item svg{flex:0 0 18px}
.nav-item:hover{background:#f3f4f6;color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.side-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--muted-2);border-top:1px solid var(--border-soft)}
/* Main + topbar */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:13px 28px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.rolebox{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.rolebox select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;
  font-weight:600;color:var(--text);background:#fff;cursor:pointer;font-family:inherit}
.content{padding:26px 30px;max-width:1220px;width:100%;margin:0 auto}
/* Cards / grids */
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:20px}
.grid-2eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h3{margin:0 0 4px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.kpi .lbl{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi .val{font-size:29px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.kpi .sub2{font-size:12px;color:var(--muted);margin-top:5px}
.kpi.danger .val{color:var(--red-tx)}
/* Tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:650;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover{background:#fafbfc}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .vendor{font-weight:600}
/* Chips */
.chip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.chip.captured{background:var(--gray-bg);color:var(--gray-tx)}
.chip.assigned{background:var(--amber-bg);color:var(--amber-tx)}
.chip.verified{background:var(--blue-bg);color:var(--blue-tx)}
.chip.approved{background:var(--green-bg);color:var(--green-tx)}
.chip.rejected{background:var(--red-bg);color:var(--red-tx)}
.chip.draft{background:var(--gray-bg);color:var(--gray-tx)}
.chip.pending{background:var(--amber-bg);color:var(--amber-tx)}
.chip.billed{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--green-bg);color:var(--green-tx)}
.chip.warn{background:var(--amber-bg);color:var(--amber-tx)}
.chip.bad{background:var(--red-bg);color:var(--red-tx)}
.chip.muted{background:var(--gray-bg);color:var(--gray-tx)}
.chip.delayed{background:var(--red-bg);color:var(--red-tx)}
.chip.active{background:var(--green-bg);color:var(--green-tx)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:650;
  font-size:13.5px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:#f9fafb}
.btn-danger{background:#fef2f2;color:var(--red-tx);border-color:#fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.015em}
.toolbar .actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{padding:9px 13px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;width:230px;font-family:inherit}
.search:focus,.rolebox select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fchips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fchip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12.5px;
  font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.fchip.active{background:var(--text);color:#fff;border-color:var(--text)}
/* Bars */
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#eef0f3;margin:6px 0 12px}
.stackbar>div{height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px}
.hbar-row{display:grid;grid-template-columns:130px 1fr 110px;gap:12px;align-items:center;margin:11px 0;font-size:13px}
.hbar-row .amt{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:34px;height:190px;padding-top:10px}
.vbar{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vbar .col{width:64px;background:var(--accent);border-radius:8px 8px 4px 4px;min-height:6px}
.vbar .mlbl{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:600}
.vbar .vval{font-size:12.5px;font-weight:700;margin-bottom:7px}
/* Activity */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .fdot{flex:0 0 8px;width:8px;height:8px;border-radius:99px;background:var(--accent);margin-top:6px}
.feed .ftime{color:var(--muted-2);font-size:11.5px;margin-top:2px}
.attn{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);
  font-size:13px;cursor:pointer}
.attn:last-child{border-bottom:0}
.attn:hover .alink{color:var(--accent-dark)}
.attn .alink{font-weight:650}
.attn .meta{font-size:12px;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:40;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;width:460px;max-width:94vw;height:100vh;background:#fff;z-index:50;
  box-shadow:-12px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:slidein .18s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-head h3{margin:0;font-size:16px;font-weight:750}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px}
.iconbtn{border:1px solid var(--border);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:#f9fafb;color:var(--text)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13.5px;margin:14px 0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}
.matchbox{border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin:14px 0;font-size:13px;background:#fbfbfc}
.sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
textarea.rmk{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;
  font-family:inherit;min-height:74px;resize:vertical}
textarea.rmk:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.rmk-item{border-left:3px solid var(--border);padding:6px 0 6px 12px;margin:8px 0;font-size:13px}
.rmk-item .who{font-weight:650;font-size:12.5px}
.rmk-item .when{color:var(--muted-2);font-size:11.5px}
/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:680px;max-width:96vw;max-height:92vh;overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.18);animation:fade .15s ease}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px;font-weight:750}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:13.5px;font-family:inherit;background:#fff;color:var(--text)}
.field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.po-items td{padding:7px 8px}
/* Toast */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px}
.toast{background:#111827;color:#fff;padding:12px 17px;border-radius:10px;font-size:13.5px;font-weight:550;
  box-shadow:0 10px 30px rgba(0,0,0,.22);animation:slidein .18s ease;max-width:340px}
.toast.ok{border-left:4px solid #22c55e}
.toast.warn{border-left:4px solid #f59e0b}
/* Events */
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ev-card{cursor:pointer;transition:box-shadow .12s,transform .12s}
.ev-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.07);transform:translateY(-1px)}
.ev-card h3{font-size:15px;margin:0 0 2px}
.ev-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.backlink{background:none;border:0;color:var(--accent);font-weight:650;font-size:13.5px;cursor:pointer;
  padding:0;margin-bottom:14px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.perm-note{font-size:12.5px;color:var(--muted);background:#f9fafb;border:1px dashed var(--border);
  border-radius:8px;padding:10px 14px;margin-top:14px}
@media(max-width:1000px){.grid-kpi{grid-template-columns:1fr 1fr}.grid-2,.grid-2eq{grid-template-columns:1fr}.ev-grid{grid-template-columns:1fr}}
.rolesel{padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff;color:var(--text);cursor:pointer;font-family:inherit;font-weight:600}
.rolesel:hover{border-color:#9ca3af}
.hamb{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;width:38px;height:38px;
  cursor:pointer;align-items:center;justify-content:center;color:var(--text);flex:0 0 38px;font-family:inherit}
.hamb:hover{background:#f9fafb}
.nav-backdrop{display:none}
@media(max-width:760px){
  .content{padding:16px}
  .topbar{padding:11px 14px;gap:10px}
  .topbar h1{font-size:15px}
  .hamb{display:inline-flex}
  .rolebox span{display:none}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:60;width:264px;max-width:82vw;
    transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 40px rgba(0,0,0,.14)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .nav-backdrop{display:block;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:55}
  .card{overflow-x:auto}
  table.tbl{min-width:620px}
  .kpi .val{font-size:24px}
  .toolbar h2{font-size:17px}
  .drawer{width:100vw;max-width:100vw}
  .frow{grid-template-columns:1fr}
  .search{width:100%}
  .vbars{gap:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="t1">Invoice &amp; Expense</div><div class="t2">Management System</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Demo prototype &middot; fictional data<br>SRS v1.1 &middot; Sep 2026</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamb" onclick="toggleNav()" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div><h1 id="page-title">Dashboard</h1><div class="sub">Client demo prototype</div></div>
      </div>
      <div class="rolebox">
        <span>Acting as</span>
        <select id="role-sel" onchange="setRole(this.value)" title="Switch role to preview role-based access (FR-09)">
          <option>Admin</option><option>Manager</option><option>Finance</option><option>Viewer</option>
        </select>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="nav-backdrop" onclick="closeNav()"></div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
"use strict";
/* ============ Constants & helpers ============ */
const TODAY = new Date("2026-09-23T00:00:00");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = n => "\u20B9" + Math.round(n).toLocaleString("en-IN");
const fmtDate = s => { const d = new Date(s+"T00:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); };
const daysSince = s => Math.floor((TODAY - new Date(s+"T00:00:00"))/86400000);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PENDING = ["captured","assigned","verified"];
const isDelayed = inv => PENDING.includes(inv.status) && daysSince(inv.date) > 7;
const PERMS = {
  Admin:   {review:true, approvePO:true, createPO:true,  label:"Full access"},
  Manager: {review:true, approvePO:true, createPO:false, label:"Can approve invoices & POs"},
  Finance: {review:true, approvePO:false,createPO:true,  label:"Can verify invoices & create POs"},
  Viewer:  {review:false,approvePO:false,createPO:false, label:"Read-only"}
};
const ICONS = {
  dash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  inv:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>',
  po:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a2 2 0 0 1 6 0M9 11h6M9 15h4"/></svg>',
  ev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  rep:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  users:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.6a3.5 3.5 0 0 1 0 6.9M18.6 14.4c1.9.9 3.1 2.7 3.1 5.6"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  dl:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg>',
  back:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>'
};
/* ============ Mock data ============ */
const EVENTS = [
  {id:"evt1", name:"Leadership Training \u2013 Goa", dates:"12\u201314 Sep 2026", loc:"Goa", budget:900000},
  {id:"evt2", name:"Annual Sales Meet \u2013 Mumbai", dates:"25\u201326 Sep 2026", loc:"Mumbai", budget:600000},
  {id:"evt3", name:"Partner Summit \u2013 Delhi", dates:"5\u20136 Sep 2026", loc:"Delhi", budget:750000}
];
const eventName = id => (EVENTS.find(e=>e.id===id)||{}).name || "\u2014";
const VENDORS = ["Sharma Travels","Grand Palm Hotel","Skyline Airways","VisaFast Services","Spice Route Catering","CityCab Rentals","Metro Stationery"];
const TEAM = ["Priya Nair","Rahul Verma","Amit Shah"];
const ASSIGN_RULE = {Travel:"Priya Nair", Flight:"Priya Nair", Hotel:"Amit Shah", Visa:"Amit Shah", Food:"Rahul Verma", Other:"Rahul Verma"};

const state = {
  role:"Admin", screen:"dashboard", invFilter:"all", invSearch:"",
  userRoleFilter:"all",
  selInvoice:null, selEvent:null, selPO:null, poSeq:207, invSeq:1014,
  invoices:[

function poMatch(p){
  const bills = state.invoices.filter(i=>i.poId===p.id && i.status!=="rejected");
  if(!bills.length) return {label:"No bills yet", cls:"muted"};
  const sum = bills.reduce((a,i)=>a+i.amount,0);
  if(sum===p.amount) return {label:"Matched", cls:"ok", detail:bills.length+" bill(s) \u00B7 "+fmt(sum)};
  if(sum<p.amount) return {label:"Partially billed", cls:"warn", detail:bills.length+" bill(s) \u00B7 "+fmt(sum)+" of "+fmt(p.amount)};
  return {label:"Over billed", cls:"bad", detail:bills.length+" bill(s) \u00B7 "+fmt(sum)+" of "+fmt(p.amount)};
}

function filteredInvoices(){
  let list = state.invoices.slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(state.invFilter==="pending") list = list.filter(i=>PENDING.includes(i.status));
  else if(state.invFilter==="approved") list = list.filter(i=>i.status==="approved");
  else if(state.invFilter==="rejected") list = list.filter(i=>i.status==="rejected");
  else if(state.invFilter==="delayed") list = list.filter(isDelayed);
  const q = state.invSearch.trim().toLowerCase();
  if(q) list = list.filter(i=>(i.vendor+" "+i.no+" "+i.assignedTo+" "+i.id).toLowerCase().includes(q));
  return list;
}

function openInvoice(id){
  state.selInvoice=id; const i = inv(id); if(!i) return;
  const can = PERMS[state.role].review;
  const m = i.poId ? po(i.poId) : null;
  const mInfo = m ? poMatch(m) : null;
  const poBox = m
    ? '<div class="matchbox"><div style="font-weight:700;margin-bottom:4px">Linked PO: '+m.id+'</div>'+
      '<div>PO value: <b>'+fmt(m.amount)+'</b> &nbsp;\u00B7&nbsp; Billed: <b>'+fmt(state.invoices.filter(x=>x.poId===m.id&&x.status!=="rejected").reduce((a,x)=>a+x.amount,0))+'</b></div>'+
      '<div style="margin-top:6px"><span class="chip '+mInfo.cls+'">'+mInfo.label+'</span>'+(mInfo.detail?' <span style="color:var(--muted);font-size:12px">'+mInfo.detail+'</span>':"")+'</div></div>'
    : '<div class="matchbox"><div style="font-weight:700;margin-bottom:4px">No purchase order linked</div><div style="color:var(--muted)">This bill arrived without a PO. It can still be verified and approved.</div></div>';
  let actions = "";
  if(can){
    if(i.status==="captured"||i.status==="assigned")
      actions = '<button class="btn btn-primary" onclick="verifyInvoice(\''+i.id+'\')">Verify details</button>';
    else if(i.status==="verified")
      actions = '<button class="btn btn-primary" onclick="approveInvoice(\''+i.id+'\')">Approve</button>'+
                '<button class="btn btn-danger" onclick="rejectInvoice(\''+i.id+'\')">Reject</button>';
    else if(i.status==="rejected")
      actions = '<button class="btn btn-primary" onclick="sendBackForCorrection(\''+i.id+'\')">Send back to '+esc(i.assignedTo)+' for correction</button>';

function simulateEmail(){
  const batch = 35+Math.floor(Math.random()*45); /* mails seen in this polling cycle */
  state.mailStats.scanned += batch;
  const q = state.emailQueue.shift();
  if(!q){
    logAct("Email poll: "+batch+" mails scanned \u2014 no new invoices");
    toast("Inbox polled: "+batch+" mails scanned, no new invoices","warn");
    render(); return;
  }
  state.mailStats.captured += 1;
  const id = "INV-"+(state.invSeq++);
  const ni = {id:id, vendor:q.vendor, no:q.no, date:"2026-09-23", amount:q.amount, eventId:q.eventId,
    cat:q.cat, assignedTo:ASSIGN_RULE[q.cat]||"Rahul Verma", status:"captured", poId:null, remarks:[],
    hist:["Captured from email \u2014 23 Sep 2026","Auto-assigned to "+(ASSIGN_RULE[q.cat]||"Rahul Verma")+" \u2014 23 Sep 2026"]};
  ni.status = "assigned";
  state.invoices.unshift(ni);
  logAct("Email poll: "+batch+" mails scanned \u2014 captured "+id+" from "+q.vendor);
  toast("Inbox polled: "+batch+" mails scanned \u2014 captured "+id+" ("+(batch-1)+" skipped)","ok");
  render(); openInvoice(id);
}

  const ok=state.invoices.filter(i=>i.status!=="rejected");
  const cats={}; ok.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.amount);
  const maxC=Math.max.apply(null,[1].concat(Object.values(cats)));
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(c=>
    '<div class="hbar-row"><div>'+esc(c[0])+'</div><div class="bar"><span style="width:'+Math.round(c[1]/maxC*100)+'%"></span></div><div class="amt">'+fmt(c[1])+'</div></div>'
  ).join("");
  const mon={}; ok.forEach(i=>{const k=i.date.slice(0,7); mon[k]=(mon[k]||0)+i.amount;});
  const mkeys=Object.keys(mon).sort();
  const maxM=Math.max.apply(null,[1].concat(Object.values(mon)));
  const mBars=mkeys.map(k=>{
    const d=new Date(k+"-01T00:00:00"), lbl=MONTHS[d.getMonth()]+" "+d.getFullYear();
    return '<div class="vbar"><div class="vval">'+fmt(mon[k])+'</div><div class="col" style="height:'+Math.max(4,Math.round(mon[k]/maxM*130))+'px"></div><div class="mlbl">'+lbl+'</div></div>';
  }).join("");
  return '<div class="toolbar"><h2>Reports</h2><div class="actions">'+
    '<button class="btn btn-ghost btn-sm" onclick="exportCSV(\'invoices\')">'+ICONS.dl+' Invoices CSV</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="exportCSV(\'delayed\')">'+ICONS.dl+' Delayed CSV</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="exportPDF()">'+ICONS.dl+' Export PDF</button>'+
  '</div></div>'+
  '<div class="grid-2">'+
    '<div class="card"><h3>Pending invoices by stage</h3><p class="hint">Live \u2014 updates as invoices move through the pipeline</p>'+
      '<table class="tbl"><thead><tr><th>Stage</th><th>Invoices</th><th class="num">Value</th></tr></thead><tbody>'+stageRows+
      '<tr><td style="font-weight:700">Total pending</td><td style="font-weight:700">'+pend.length+'</td><td class="num" style="font-weight:700">'+fmt(pend.reduce((a,i)=>a+i.amount,0))+'</td></tr></tbody></table></div>'+
    '<div class="card"><h3>Delayed items</h3><p class="hint">Pending over 7 days, with the owner responsible</p>'+
      (delRows? '<table class="tbl"><thead><tr><th>Invoice</th><th>Vendor</th><th>Owner</th><th>Delayed</th><th class="num">Amount</th></tr></thead><tbody>'+delRows+'</tbody></table>'
              : '<div class="empty">No delayed items right now.</div>')+'</div>'+
  '</div>'+
  '<div class="grid-2eq">'+
    '<div class="card"><h3>Spend by category</h3><p class="hint">All non-rejected bills</p>'+catRows+'</div>'+
    '<div class="card"><h3>Spend by month</h3><p class="hint">All non-rejected bills</p><div class="vbars">'+mBars+'</div></div>'+
  '</div>';
}
function downloadCSV(name, rows){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=rows.map(r=>r.map(q).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
}
function exportCSV(kind){
  if(kind==="invoices"){
    downloadCSV("invoices-2026-09-23.csv",
      [["ID","Vendor","Invoice No","Date","Amount (INR)","Category","Event","Assigned To","Status","Linked PO"]]
      .concat(state.invoices.map(i=>[i.id,i.vendor,i.no,i.date,i.amount,i.cat,eventName(i.eventId),i.assignedTo,i.status,i.poId||""])));
    toast("Invoices CSV downloaded","ok");
  } else {
    const del=state.invoices.filter(isDelayed);
    downloadCSV("delayed-items-2026-09-23.csv",
      [["ID","Vendor","Invoice No","Date","Amount (INR)","Owner","Days Delayed"]]
      .concat(del.map(i=>[i.id,i.vendor,i.no,i.date,i.amount,i.assignedTo,daysSince(i.date)])));
    toast(del.length+" delayed item(s) exported","ok");
  }
  logAct("Report exported ("+kind+" CSV)");
}
function exportPDF(){ toast("PDF export is disabled in this demo build","warn"); }
/* ============ Invoice actions (pipeline) ============ */
function checkPOBilling(invObj){
  if(!invObj.poId) return;
  const p=po(invObj.poId); if(!p||p.status!=="approved") return;
  const m=poMatch(p);
  if(m.label==="Matched"){
    p.status="billed"; p.hist.push("Fully billed \u2014 23 Sep 2026");
    logAct(p.id+" fully billed \u2014 moved to Billed");
    toast(p.id+" fully billed \u2014 moved to Billed","ok");
  }
}
/* ============ Users — FR-10 onboarding with maker-checker ============ */
const MANAGER_IDENTITY = "Priya Nair"; /* acting manager persona for this demo */
function genUsername(name){
  const parts = name.trim().toLowerCase().split(/\s+/);
  const base = parts[0]+"."+parts[parts.length-1];
  const taken = {};
  state.users.forEach(x=>{ if(x.username) taken[x.username]=1; });
  let u = base, k = 2;
  while(taken[u]) u = base + (k++);
  return u;
}
function genPassword(){
  const cs = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  let s = "";
  for(let i=0;i<10;i++) s += cs[Math.floor(Math.random()*cs.length)];
  return s;
}
function setUserRoleFilter(v){ state.userRoleFilter=v; render(); }
function vUsers(){
  const canPropose = state.role==="Manager"||state.role==="Admin";
  const canApprove = state.role==="Admin";
  const isMgr = state.role==="Manager";
  const visible = isMgr ? state.users.filter(u=>u.role!=="Admin") : state.users;
  const f = (state.userRoleFilter==="admin"&&isMgr) ? "all" : (state.userRoleFilter||"all");
  const list = f==="all" ? visible : visible.filter(u=>u.role===f);
  const cnt = r => visible.filter(u=>u.role===r).length;
  const rolesel = '<select class="rolesel" onchange="setUserRoleFilter(this.value)" title="Filter users by role">'+
    '<option value="all"'+(f==="all"?" selected":"")+'>All roles ('+visible.length+')</option>'+
    (isMgr?["Manager","Finance","Viewer"]:["Admin","Manager","Finance","Viewer"]).map(r=>'<option value="'+r+'"'+(f===r?" selected":"")+'>'+r+'s ('+cnt(r)+')</option>').join("")+
  '</select>';
  const rows = list.map((u,ix)=>{
    const rejNote = (u.status==="rejected"&&u.remarks.length)
      ? '<div style="font-size:12px;color:var(--red-tx);margin-top:4px">Rejected: '+esc(u.remarks[u.remarks.length-1].text)+'</div>' : "";
    let actions = '<span style="font-size:12px;color:var(--muted-2)">\u2014</span>';
    if(u.status==="pending"){
      if(canApprove)
        actions = '<button class="btn btn-primary btn-sm" onclick="approveUser('+ix+')">Approve</button> '+
                  '<button class="btn btn-danger btn-sm" onclick="openRejectUserModal('+ix+')">Reject</button>';
      else
        actions = '<span style="font-size:12.5px;color:var(--amber-tx);font-weight:650">Awaiting Admin approval</span>';
    } else if(u.status==="active"){
      actions = '<span class="chip ok">Credentials issued</span>';
    }
    return '<tr>'+
      '<td><div class="vendor">'+esc(u.name)+'</div>'+(u.email?'<div style="font-size:11.5px;color:var(--muted)">'+esc(u.email)+'</div>':"")+'</td>'+
      '<td>'+(u.username? '<span style="font-family:monospace;font-weight:650">'+esc(u.username)+'</span>' : '<span style="color:var(--muted-2)">\u2014</span>')+'</td>'+
      '<td>'+esc(u.role)+'</td>'+
      '<td style="font-size:12.5px">'+esc(u.loc||"—")+'</td>'+
      '<td><span class="chip '+u.status+'">'+u.status.charAt(0).toUpperCase()+u.status.slice(1)+'</span>'+rejNote+'</td>'+
      '<td style="font-size:12.5px">'+esc(isMgr?u.createdBy.replace(/system administrator/i,"Admin"):u.createdBy)+'</td><td>'+actions+'</td></tr>';
  }).join("");
  return ''+
  '<div class="toolbar"><h2>Users</h2><div class="actions">'+
    rolesel+
    (canPropose ? '<button class="btn btn-primary" onclick="openUserModal()">'+ICONS.plus+' Create New User</button>' : '')+
  '</div></div>'+
  '<div class="card"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Location</th><th>Status</th><th>Created by</th><th>Actions</th></tr></thead>'+
  '<tbody>'+rows+'</tbody></table>'+
  '<div class="perm-note">Maker\u2013checker: a Manager can propose a new user \u2014 no self-registration. The Admin approves the request and generates the username &amp; password; the Admin can also create a user directly (activated immediately). Rejected requests return with remarks.</div></div>';
}
function openUserModal(){
  const isAdmin = state.role==="Admin";
  const mRoleOpts = isAdmin ? ["Manager","Finance","Viewer","Admin"] : ["Manager","Finance","Viewer"];
  openModal(
    '<div class="modal-head"><h3>Create New User</h3><button class="iconbtn" onclick="closeModal()">'+ICONS.x+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><label>Full Name</label><input id="u-name" placeholder="e.g. Rohit Gupta"></div>'+
      '<div class="field"><label>Email</label><input id="u-email" type="email" placeholder="name@company.com"></div>'+
      '<div class="field"><label>Role</label><select id="u-role">'+mRoleOpts.map(r=>'<option>'+r+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>Location</label><input id="u-loc" placeholder="e.g. Mumbai"></div>'+
      '<div class="perm-note">'+(isAdmin?"As Admin, the user is activated immediately with auto-generated credentials.":"This submits a request to the Admin for approval. The username &amp; password are generated by the Admin after approval — not here.")+'</div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="submitUser()">'+(isAdmin?"Create user":"Submit for approval")+'</button></div>'
  );
}
function submitUser(){
  const name = document.getElementById("u-name").value.trim();
  const email = document.getElementById("u-email").value.trim();
  const role = document.getElementById("u-role").value;
  const loc = (document.getElementById("u-loc").value||"").trim();
  if(!name){ toast("Please enter the full name","warn"); return; }
  if(!email || email.indexOf("@")<0){ toast("Please enter a valid email","warn"); return; }
  if(state.role==="Admin"){
    let username = email.split("@")[0].toLowerCase().replace(/[^a-z0-9.]/g,"")||"user";
    let n = 2;
    while(state.users.some(u=>u.username===username)) username = username.replace(/\d+$/,"")+n++;
    const password = "Pass"+Math.floor(1000+Math.random()*9000)+"!";
    state.users.push({name:name, email:email, username:username, password:password, role:role, status:"active",
      createdBy:"System Administrator", loc:loc, remarks:[],
      hist:["Created directly by Admin \u2014 23 Sep 2026","Credentials issued by Admin \u2014 23 Sep 2026"]});
    logAct("Admin created user "+name+" ("+role+")");
    closeModal(); render();
    toast("User created & activated. Username: "+username+" · Password: "+password,"ok");
  } else {
    state.users.push({name:name, email:email, username:null, password:null, role:role, status:"pending",
      createdBy:MANAGER_IDENTITY+" (Manager)", loc:loc, remarks:[],
      hist:["Requested by "+MANAGER_IDENTITY+" \u2014 23 Sep 2026"]});
    logAct("New user requested: "+name+" ("+role+")");
    closeModal(); render();
    toast("Request sent to Admin for approval","ok");
  }
}
function approveUser(ix){
  const u = state.users[ix]; if(!u || u.status!=="pending") return;
  const username = genUsername(u.name), password = genPassword();
  u.username = username; u.password = password; u.status = "active";
  u.hist.push("Approved by Admin \u2014 credentials generated \u2014 23 Sep 2026");
  logAct("User approved: "+u.name+" ("+u.role+") \u2014 credentials issued");
  render();
  openModal(
    '<div class="modal-head"><h3>Credentials generated</h3><button class="iconbtn" onclick="closeModal()">'+ICONS.x+'</button></div>'+
    '<div class="modal-body">'+
      '<p style="font-size:13.5px;color:var(--muted);margin-top:0">'+esc(u.name)+' is now <b>Active</b>. Share these credentials with the user \u2014 users cannot self-register.</p>'+
      '<div class="field"><label>Username</label><input readonly value="'+esc(username)+'" onclick="this.select()" style="font-family:monospace;font-weight:700"></div>'+
      '<div class="field"><label>Password</label><input readonly value="'+esc(password)+'" onclick="this.select()" style="font-family:monospace;font-weight:700"></div>'+
      '<div class="perm-note">Copy and share securely. The password is shown only once \u2014 on this screen.</div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>'
  );
  toast("Credentials issued for "+u.name,"ok");
}
function openRejectUserModal(ix){
  openModal(
    '<div class="modal-head"><h3>Reject user request</h3><button class="iconbtn" onclick="closeModal()">'+ICONS.x+'</button></div>'+
    '<div class="modal-body">'+
      '<p style="font-size:13.5px;color:var(--muted);margin-top:0">Rejecting the request for <b>'+esc(state.users[ix].name)+'</b>. A remark is required \u2014 it will be visible against the request.</p>'+
      '<div class="field"><label>Remark (required)</label><textarea class="rmk" id="u-rej-rmk" placeholder="Reason for rejection\u2026"></textarea></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-danger" onclick="rejectUser('+ix+')">Reject request</button></div>'
  );
}
function rejectUser(ix){
  const u = state.users[ix]; if(!u || u.status!=="pending") return;
  const r = ((document.getElementById("u-rej-rmk")||{}).value||"").trim();
  if(!r){ toast("Please add a remark explaining the rejection","warn"); return; }
  u.status = "rejected";
  u.remarks.push({by:"Admin", text:r, when:"23 Sep 2026"});
  u.hist.push("Rejected by Admin \u2014 23 Sep 2026");
  logAct("User request rejected: "+u.name+" ("+u.role+")");
  closeModal(); toast("Request rejected \u2014 remarks recorded","warn"); render();
}
/* ============ Init ============ */
state.pos.forEach(p=>{ p.remarks=p.remarks||[]; p.hist=p.hist||[]; });
render();
</script>
